<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aftab Ahmed | Business Administration & Development</title>
<meta name="description" content="Aftab Ahmed - Business Administration, Business Development, Entrepreneurship, Strategy and Growth.">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:82px}
body{font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033;overflow-x:hidden}
section{scroll-margin-top:82px}
a{text-decoration:none;color:inherit}
button,textarea,input{font-family:inherit}
.container{width:90%;max-width:1200px;margin:auto}

/* OPENING */
#openingScreen{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#07111f;transition:opacity .35s ease,visibility .35s ease}
#openingScreen.hide{opacity:0;visibility:hidden;pointer-events:none}
.opening-office-bg{position:absolute;inset:0;background-image:url("https://images.pexels.com/photos/36766669/pexels-photo-36766669.jpeg");background-size:cover;background-position:center;filter:brightness(.48) saturate(.9);transform:scale(1.03)}
.opening-office-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(7,17,31,.78),rgba(15,43,75,.55),rgba(7,17,31,.82))}
.opening-content{position:relative;z-index:2;text-align:center;color:white;padding:30px}
.portfolio-label{display:inline-block;margin:0 auto 22px;padding:10px 22px;border:1px solid rgba(255,255,255,.55);border-radius:30px;color:#dbeafe;font-size:13px;font-weight:800;letter-spacing:4px;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.18)}
.portfolio-title{
    display:inline-block;
    margin:0 auto 22px;
    padding:12px 28px;
    border:1px solid rgba(255,255,255,.5);
    border-radius:8px;
    background:rgba(7,17,31,.35);
    color:#ffffff;
    font-size:clamp(30px,5vw,52px);
    font-weight:900;
    letter-spacing:8px;
    text-align:center;
    text-shadow:0 3px 20px rgba(0,0,0,.45);
}
.opening-content h1{margin-top:25px;font-size:clamp(28px,5vw,44px);letter-spacing:3px;text-shadow:0 3px 20px rgba(0,0,0,.4)}
.opening-content p{margin-top:10px;color:#dbeafe;font-size:14px}
.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:#60a5fa;opacity:.5;animation:particleMove 7s linear infinite}
.p1{left:10%;top:80%}.p2{left:25%;top:20%;animation-delay:1s}.p3{left:48%;top:75%;animation-delay:2s}.p4{left:72%;top:25%;animation-delay:3s}.p5{left:90%;top:70%;animation-delay:4s}.p6{left:55%;top:10%;animation-delay:2.5s}
@keyframes particleMove{0%{transform:translateY(0);opacity:0}30%{opacity:.7}100%{transform:translateY(-300px);opacity:0}}

/* START WEBSITE */
function startWebsite(){
  const main=document.getElementById("mainWebsite");
  if(main)main.style.display="block";
  startTyping();
  revealSections();
}

window.addEventListener("DOMContentLoaded",function(){
  startWebsite();
});

/* NAVIGATION */
function goToSection(id){
  const section=document.getElementById(id);
  if(!section){console.log("Section not found:",id);return}
  section.scrollIntoView({behavior:"smooth",block:"start"});
  const nav=document.getElementById("navLinks");
  if(nav)nav.classList.remove("active");
}
function toggleMenu(){
  const nav=document.getElementById("navLinks");
  if(nav)nav.classList.toggle("active");
}

/* TYPING */
function startTyping(){
  const typingElement=document.getElementById("typingText");
  if(!typingElement)return;
  const words=["Business Administration","Business Development","Entrepreneurial Strategy","Operations & Growth","Leadership & Innovation"];
  let wordIndex=0,characterIndex=0,deleting=false;
  function type(){
    const currentWord=words[wordIndex];
    if(!deleting){
      typingElement.textContent=currentWord.substring(0,characterIndex+1);
      characterIndex++;
      if(characterIndex===currentWord.length){deleting=true;setTimeout(type,1500);return}
    }else{
      typingElement.textContent=currentWord.substring(0,characterIndex-1);
      characterIndex--;
      if(characterIndex===0){deleting=false;wordIndex=(wordIndex+1)%words.length}
    }
    setTimeout(type,deleting?45:80);
  }
  type();
}

/* REVEAL */
function revealSections(){
  const elements=document.querySelectorAll(".reveal");
  function reveal(){
    elements.forEach(function(element){
      const position=element.getBoundingClientRect();
      if(position.top<window.innerHeight-80)element.classList.add("visible");
    });
  }
  window.addEventListener("scroll",reveal,{passive:true});
  reveal();
}

/* SCROLL TOP */
window.addEventListener("scroll",function(){
  const button=document.getElementById("scrollTop");
  if(button){if(window.scrollY>500)button.classList.add("show");else button.classList.remove("show")}
},{passive:true});

/* PROFILE IMAGE FALLBACK */
function showPhotoFallback(img){
  img.style.display="none";
  const frame=img.parentElement;
  if(!frame.querySelector(".photo-fallback")){
    const fallback=document.createElement("div");
    fallback.className="photo-fallback";
    fallback.style.cssText="width:100%;height:100%;border-radius:20px;background:linear-gradient(145deg,#0b1628,#2563eb);display:flex;align-items:center;justify-content:center;color:white;font-size:54px;font-weight:900";
    fallback.textContent="AA";
    frame.appendChild(fallback);
  }
}

/* BUSINESS AI DEMO */
function setQuestion(question){
  const input=document.getElementById("businessQuestion");
  input.value=question;
  input.focus();
}

function escapeHTML(text){
  const div=document.createElement("div");
  div.textContent=text;
  return div.innerHTML;
}

function addChatMessage(type,label,content){
  const chat=document.getElementById("chatMessages");
  const message=document.createElement("div");
  message.className="chat-message"+(type==="user"?" user-message":"");
  message.innerHTML='<div class="message-avatar">'+label+'</div><div class="message-content">'+content+'</div>';
  chat.appendChild(message);
  chat.scrollTop=chat.scrollHeight;
  return message;
}

function askBusinessAI(){
  const input=document.getElementById("businessQuestion");
  const question=input.value.trim();
  if(!question){input.focus();return}
  addChatMessage("user","YOU",escapeHTML(question));
  input.value="";
  const thinking=addChatMessage("ai","AI",'<span class="typing-answer">Thinking about your business question...</span>');
  setTimeout(function(){
    thinking.remove();
    addChatMessage("ai","AI",getBusinessAnswer(question));
  },700);
}

function getBusinessAnswer(question){
  const q=question.toLowerCase();

  if(q.includes("customer")||q.includes("retention"))return `<strong>Customer Retention</strong><br><br>To improve customer retention, focus on understanding why customers stay or leave.<br><br><strong>1.</strong> Improve customer service.<br><strong>2.</strong> Follow up after a sale.<br><strong>3.</strong> Offer consistent quality.<br><strong>4.</strong> Build long-term relationships.<br><strong>5.</strong> Ask customers for feedback.<br><br><strong>Key lesson:</strong> Customer retention depends on consistently delivering value and building trust.`;

  if(q.includes("sales")||q.includes("revenue"))return `<strong>Increasing Sales</strong><br><br>A business can approach sales growth by improving its offer, reaching the right customers and strengthening its sales process.<br><br><strong>1.</strong> Identify the target customer.<br><strong>2.</strong> Understand their needs.<br><strong>3.</strong> Improve the value proposition.<br><strong>4.</strong> Build a consistent sales process.<br><strong>5.</strong> Measure results and improve.<br><br><strong>Key lesson:</strong> Sales growth should be connected to customer value and a measurable sales process.`;

  if(q.includes("development"))return `<strong>Business Development</strong><br><br>Business development focuses on identifying opportunities that can create long-term value for an organization.<br><br>It can involve:<br><br>• Finding new markets<br>• Building professional relationships<br>• Developing partnerships<br>• Understanding customer needs<br>• Creating growth opportunities<br><br><strong>Key lesson:</strong> Business development combines relationships, market understanding and strategic thinking.`;

  if(q.includes("strategy")||q.includes("strategic"))return `<strong>Business Strategy</strong><br><br>A business strategy provides a structured direction for achieving important objectives.<br><br>Start with:<br><br><strong>1.</strong> Define the objective.<br><strong>2.</strong> Understand the current situation.<br><strong>3.</strong> Identify opportunities and risks.<br><strong>4.</strong> Select practical actions.<br><strong>5.</strong> Measure the results.<br><br><strong>Key lesson:</strong> Good strategy connects objectives with practical actions and measurable results.`;

  if(q.includes("leadership")||q.includes("leader"))return `<strong>Business Leadership</strong><br><br>Effective leadership involves creating clarity, communicating expectations and helping people work toward shared objectives.<br><br>Important areas include:<br><br>• Communication<br>• Responsibility<br>• Teamwork<br>• Decision-making<br>• Problem solving<br>• Continuous improvement<br><br><strong>Key lesson:</strong> Leadership involves direction, communication, responsibility and support for the team.`;

  if(q.includes("entrepreneur")||q.includes("startup")||q.includes("business idea"))return `<strong>Entrepreneurship</strong><br><br>A strong business idea should begin with a real customer problem or opportunity.<br><br>A simple process is:<br><br><strong>Problem → Customer → Solution → Test → Improve → Grow</strong><br><br>Before investing heavily, test whether customers actually value the proposed solution.<br><br><strong>Key lesson:</strong> Validate the problem and customer need before investing heavily in a solution.`;

  if(q.includes("management")||q.includes("administration"))return `<strong>Business Administration</strong><br><br>Business administration helps an organization coordinate its people, resources, information and daily activities.<br><br>Key areas include:<br><br>• Planning<br>• Organization<br>• Documentation<br>• Communication<br>• Resource management<br>• Performance monitoring<br><br><strong>Key lesson:</strong> Strong administration creates structure that supports efficient business operations.`;

  return `<strong>Business Learning Response</strong><br><br>Your question is related to an important area of business thinking.<br><br>A useful way to approach most business questions is:<br><br><strong>1. Understand the problem</strong><br>Identify what is happening and why it matters.<br><br><strong>2. Understand the customer</strong><br>Consider who receives the value and what they need.<br><br><strong>3. Identify options</strong><br>Develop several practical approaches before choosing a solution.<br><br><strong>4. Take action</strong><br>Select a practical step and test the result.<br><br><strong>5. Learn and improve</strong><br>Measure the outcome and use the learning to improve the next decision.<br><br><strong>Key lesson:</strong> Good business development comes from continuous learning, action and improvement.`;
}

document.addEventListener("keydown",function(event){
  const input=document.getElementById("businessQuestion");
  if(document.activeElement===input&&event.key==="Enter"&&!event.shiftKey){
    event.preventDefault();
    askBusinessAI();
  }
});

document.addEventListener("click",function(event){
  const nav=document.getElementById("navLinks");
  const toggle=document.querySelector(".menu-toggle");
  if(nav&&toggle&&nav.classList.contains("active")&&!nav.contains(event.target)&&!toggle.contains(event.target))nav.classList.remove("active");
});
</script>

</body>
</html>
